[project]
name = "alex"
version = "0.1.0"
description = "AI Documentation Engine — understands and documents codebases of any size."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "lancedb>=0.9.0",
    "tree-sitter>=0.24.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-rust>=0.23.0",
    "tenacity>=8.3.0",
    "python-dotenv>=1.0.0",
    "orjson>=3.10.0",
    "pathspec>=0.12.0",
    "markdown>=3.5.0",
    "reportlab>=4.0.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
providers = [
    "openai>=1.30.0",
    "anthropic>=0.28.0",
    "google-generativeai>=0.7.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.10.0",
    "ruff>=0.5.0",
]

[project.scripts]
alex = "app:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "config",
    "graph",
    "agents",
    "llm",
    "parsers",
    "scanner",
    "embeddings",
    "database",
    "retrieval",
    "memory",
    "exporters",
    "utils",
]
include = [
    "app.py",
    "prompts/*.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
